<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水电站数字孪生仿真平台</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D 画布容器 -->
  <div id="viewport"></div>

  <!-- 顶部标题栏 -->
  <header id="topbar">
    <span class="logo">⚡ 水电站数字孪生仿真平台</span>
    <span id="fps" class="fps"></span>
  </header>

  <!-- 加载遮罩 -->
  <div id="loading">
    <div class="spinner"></div>
    <p>正在加载三维场景…</p>
  </div>

  <!-- 右侧控制面板（由 ui/Panel.js 填充） -->
  <aside id="panel"></aside>

  <!-- 构件参数卡片（由 ui/Inspector.js 填充） -->
  <div id="inspector" class="hidden"></div>

  <!-- 漫游模式提示 -->
  <div id="fly-tip" class="hidden">自由漫游中 —— WASD 移动 / QE 升降 / 鼠标转向 / ESC 退出</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
